<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E2633">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Богатый вайбкодер, бедный программист. Книга о деньгах, нейросетях и двух отцах.">
<title>Богатый вайбкодер, бедный программист</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/lora.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/unbounded-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" data-theme="paper">

  <main id="desk">
    <div id="book">
      <div id="edges"></div>
      <div id="stage"></div>
    </div>

    <nav id="bar" aria-label="Навигация по книге">
      <button class="ib" id="btn-toc" aria-label="Содержание">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6.5h2M9.5 6.5H20M4 12h2M9.5 12H20M4 17.5h2M9.5 17.5H16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="progress" aria-label="Открыть содержание">
        <span id="track"><i id="fill"></i><span id="ticks"></span></span>
        <span id="count">&nbsp;</span>
      </button>
      <button class="ib" id="btn-view" aria-label="Шрифт и бумага"><span class="aa">Аа</span></button>
    </nav>
  </main>

  <div id="scrim"></div>

  <section class="sheet" id="sheet-toc" aria-label="Содержание" aria-hidden="true">
    <header><h2>Содержание</h2><button class="x" data-close aria-label="Закрыть"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
    <div class="body" id="toc-list"></div>
  </section>

  <section class="sheet" id="sheet-view" aria-label="Шрифт и бумага" aria-hidden="true">
    <header><h2>Шрифт и бумага</h2><button class="x" data-close aria-label="Закрыть"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
    <div class="body">
      <div class="opt">
        <div class="opt-name">Размер букв</div>
        <div class="sizer">
          <button id="fs-minus" aria-label="Мельче"><span style="font-size:15px">А</span></button>
          <div id="fs-dots" aria-hidden="true"></div>
          <button id="fs-plus" aria-label="Крупнее"><span style="font-size:23px">А</span></button>
        </div>
      </div>
      <div class="opt">
        <div class="opt-name">Бумага</div>
        <div class="papers" role="radiogroup" aria-label="Бумага">
          <button role="radio" data-theme-pick="paper"><i style="background:#FAF6EE;color:#1E2633">Аа</i><span>Белая</span></button>
          <button role="radio" data-theme-pick="sepia"><i style="background:#F0E3CA;color:#33291E">Аа</i><span>Сепия</span></button>
          <button role="radio" data-theme-pick="night"><i style="background:#1B222E;color:#D9D3C5">Аа</i><span>Ночь</span></button>
        </div>
      </div>
    </div>
  </section>

  <section class="sheet sheet--tall" id="sheet-notes" aria-label="Тетрадь" aria-hidden="true">
    <header><h2>Тетрадь на десять недель</h2><button class="x" data-close aria-label="Закрыть"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
    <div class="body" id="notes-list"></div>
  </section>

  <div id="zoom" aria-hidden="true">
    <div id="zoom-in"></div>
    <button class="x" id="zoom-x" aria-label="Закрыть"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div id="zoom-tip">Нажмите на картинку, чтобы приблизить</div>
  </div>

  <div id="toast" role="status"></div>

  <div id="splash">
    <svg viewBox="0 0 200 200" width="116" height="116" aria-hidden="true">
      <path d="M38 71 L71 100 L38 129" fill="none" stroke="#E9692C" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="136" cy="100" r="36" fill="#E8B84A"/><circle cx="136" cy="100" r="29.5" fill="none" stroke="#C99A2E" stroke-width="1.8"/>
      <path d="M528 594H278L383 699V0H150V750H544Q635 750 700.0 720.5Q765 691 799.5 637.5Q834 584 834 511Q834 439 799.5 385.0Q765 331 700.0 301.5Q635 272 544 272H47V428H528Q563 428 581.5 450.0Q600 472 600 511Q600 551 581.5 572.5Q563 594 528 594ZM47 77V211H679V77Z" transform="translate(122.7,116.5) scale(0.044,-0.044)" fill="#1E2633"/>
    </svg>
    <noscript><p style="color:#F3EDE0;font:16px sans-serif;padding:0 24px;text-align:center">Чтобы читать книгу, включите JavaScript.</p></noscript>
  </div>
</div>

<script src="book.js"></script>
<script src="app.js"></script>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
